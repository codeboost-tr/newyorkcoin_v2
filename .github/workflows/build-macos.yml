name: macOS Build

on:
  push:
    branches: [ nyc-core-v2.0 ]
    tags:     [ 'v*' ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install automake libtool pkg-config boost openssl@3 miniupnpc qt@5 qrencode libnatpmp libevent berkeley-db@4

      - name: Configure
        run: |
          # Use glibtoolize (brew libtool) explicitly so autoreconf finds ltmain.sh
          export LIBTOOLIZE="$(brew --prefix libtool)/bin/glibtoolize"
          autoreconf -fi
          export PKG_CONFIG_PATH="$(brew --prefix qt@5)/lib/pkgconfig:$(brew --prefix libevent)/lib/pkgconfig:$(brew --prefix miniupnpc)/lib/pkgconfig"
          # Pass CPPFLAGS and LDFLAGS as configure args so AC_CHECK_LIB picks them up
          ./configure \
            --disable-tests \
            --disable-bench \
            --with-gui=qt5 \
            --with-boost=$(brew --prefix boost) \
            --with-boost-libdir=$(brew --prefix boost)/lib \
            --with-incompatible-bdb \
            CXXFLAGS="-O2" \
            CPPFLAGS="-I$(brew --prefix openssl@3)/include -I$(brew --prefix berkeley-db@4)/include -I$(brew --prefix boost)/include -I$(brew --prefix miniupnpc)/include" \
            LDFLAGS="-L$(brew --prefix openssl@3)/lib -L$(brew --prefix berkeley-db@4)/lib -L$(brew --prefix boost)/lib"

      - name: Build
        run: make -j$(sysctl -n hw.logicalcpu)

      - name: Collect artifacts
        run: |
          mkdir -p release-macos
          cp src/qt/nyc-qt release-macos/ 2>/dev/null || true
          cp src/nycd src/nyc-cli src/nyc-tx src/nyc-wallet release-macos/ 2>/dev/null || true

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: NewYorkCoin-Core-macOS
          path: release-macos/
          retention-days: 30
