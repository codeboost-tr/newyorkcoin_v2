name: macOS Build

on:
  push:
    branches: [ nyc-core-v2.0 ]
    tags:     [ 'v*' ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install automake libtool pkg-config boost openssl miniupnpc qt@5 qrencode libnatpmp libevent

      - name: Build depends (macOS)
        run: |
          make -C depends -j$(sysctl -n hw.logicalcpu) NO_QT=0 NO_UPNP=0

      - name: Configure
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/$(./depends/config.guess)/share/config.site \
          ./configure \
            --prefix=/ \
            --disable-tests \
            --disable-bench \
            --with-gui=qt5 \
            --enable-reduce-exports \
            CXXFLAGS="-O2"

      - name: Build
        run: make -j$(sysctl -n hw.logicalcpu)

      - name: Create DMG
        run: make deploy

      - name: Rename artifacts
        run: |
          for f in *.dmg NewYorkCoin*.dmg nyc*.dmg; do
            [ -f "$f" ] && mv "$f" "NewYorkCoin-Core-macOS.dmg" && break
          done
          mkdir -p release-macos
          cp src/nycd src/nyc-cli src/nyc-tx src/nyc-wallet release-macos/ 2>/dev/null || true
          [ -f NewYorkCoin-Core-macOS.dmg ] && cp NewYorkCoin-Core-macOS.dmg release-macos/

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NewYorkCoin-Core-macOS
          path: release-macos/
          retention-days: 30
