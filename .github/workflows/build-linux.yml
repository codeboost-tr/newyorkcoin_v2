name: Linux Build

on:
  push:
    branches: [ nyc-core-v2.0 ]
  pull_request:
    branches: [ nyc-core-v2.0 ]
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-nogui

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config bsdmainutils curl \
            libboost-system-dev libboost-filesystem-dev libboost-thread-dev libboost-test-dev \
            libdb5.3-dev libdb5.3++-dev \
            libssl-dev \
            libevent-dev \
            libsqlite3-dev \
            libminiupnpc-dev \
            libzmq3-dev \
            libfmt-dev \
            python3

      - name: Configure for Linux
        run: |
          autoreconf -fi
          ./configure \
            --disable-tests \
            --disable-bench \
            --with-gui=no \
            --with-incompatible-bdb \
            --enable-reduce-exports \
            CC="ccache gcc" CXX="ccache g++" \
            CXXFLAGS="-O2"

      - name: Build
        run: make -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p release-linux
          cp src/nycd src/nyc-cli src/nyc-tx release-linux/
          [ -f src/nyc-wallet ] && cp src/nyc-wallet release-linux/ || true

      - name: Create tarball
        run: |
          tar -czf newyorkcoin-linux-x86_64.tar.gz -C release-linux .

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: NewYorkCoin-Core-Linux
          path: newyorkcoin-linux-x86_64.tar.gz
          retention-days: 30

  build-linux-qt:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config bsdmainutils curl \
            libboost-system-dev libboost-filesystem-dev libboost-thread-dev libboost-test-dev \
            libdb5.3-dev libdb5.3++-dev \
            libssl-dev \
            libevent-dev \
            libsqlite3-dev \
            libminiupnpc-dev \
            libzmq3-dev \
            libfmt-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools \
            libqt5dbus5 libqt5network5 libqt5widgets5 \
            python3

      - name: Configure for Linux Qt
        run: |
          autoreconf -fi
          ./configure \
            --disable-tests \
            --disable-bench \
            --with-gui=qt5 \
            --with-incompatible-bdb \
            --enable-reduce-exports \
            CXXFLAGS="-O2"

      - name: Build
        run: make -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p release-linux-qt
          cp src/qt/nyc-qt release-linux-qt/
          cp src/nycd src/nyc-cli src/nyc-tx release-linux-qt/
          [ -f src/nyc-wallet ] && cp src/nyc-wallet release-linux-qt/ || true

      - name: Create tarball
        run: |
          tar -czf newyorkcoin-linux-qt-x86_64.tar.gz -C release-linux-qt .

      - name: Upload Linux Qt binaries
        uses: actions/upload-artifact@v4
        with:
          name: NewYorkCoin-Core-Linux-Qt
          path: newyorkcoin-linux-qt-x86_64.tar.gz
          retention-days: 30

  # Discovery job (Phase 1.2): build WITH unit tests and run `make check`.
  # Not yet a required gate — it exists to surface which unit tests were broken
  # during the fork so they can be fixed and then made mandatory.
  test-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-test

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config bsdmainutils curl \
            libboost-system-dev libboost-filesystem-dev libboost-thread-dev libboost-test-dev \
            libdb5.3-dev libdb5.3++-dev \
            libssl-dev \
            libevent-dev \
            libsqlite3-dev \
            libminiupnpc-dev \
            libzmq3-dev \
            libfmt-dev \
            python3

      - name: Configure with unit tests enabled
        run: |
          autoreconf -fi
          ./configure \
            --enable-tests \
            --disable-bench \
            --with-gui=no \
            --with-incompatible-bdb \
            --enable-reduce-exports \
            CC="ccache gcc" CXX="ccache g++" \
            CXXFLAGS="-O2"

      # NOTE: the unit test binary is still named test_litecoin (fork leftover,
      # rename tracked for the Phase 5 packaging pass).
      - name: Build (including the unit test binary)
        run: make -j$(nproc)

      # `-k` keeps going after the first failing suite so a single run produces a
      # complete inventory of what the fork broke, instead of stopping at the first one.
      - name: Run unit tests (make check)
        run: make check -k VERBOSE=1

      - name: Collect per-suite test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: |
            src/test/*.log
            src/wallet/test/*.log
          if-no-files-found: warn
          retention-days: 14
