name: Windows Build

on:
  push:
    branches: [ nyc-core-v2.0 ]
    tags:     [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compile toolchain and NSIS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config bsdmainutils curl \
            gcc-10 g++-10 \
            g++-mingw-w64-x86-64 mingw-w64-x86-64-dev \
            nsis \
            python3

      - name: Set compilers (GCC 10 native for Qt compat, posix threads for MinGW)
        run: |
          # Qt 5.9.8 is incompatible with GCC 11's strict std::max - use GCC 10 for native tools
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 10
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 5
          sudo update-alternatives --set gcc /usr/bin/gcc-10
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 10
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 5
          sudo update-alternatives --set g++ /usr/bin/g++-10
          # MinGW uses posix threads variant
          sudo update-alternatives --set x86_64-w64-mingw32-gcc  /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++  /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: depends/built
          key: depends-windows-${{ hashFiles('depends/packages/*.mk', 'depends/Makefile') }}
          restore-keys: depends-windows-

      - name: Build depends for Windows
        run: |
          make -C depends -j$(nproc) HOST=x86_64-w64-mingw32

      - name: Configure for Windows cross-compile
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site \
          ./configure \
            --prefix=/ \
            --host=x86_64-w64-mingw32 \
            --disable-tests \
            --disable-bench \
            --with-gui=qt5 \
            --enable-reduce-exports \
            CXXFLAGS="-O2"

      - name: Build
        run: make -j$(nproc)

      - name: Create NSIS installer
        run: make deploy

      - name: Collect artifacts
        run: |
          mkdir -p release-windows
          find . -maxdepth 2 -name "*.exe" | grep -v test | head -5 | xargs -I{} cp {} release-windows/ 2>/dev/null || true
          cp src/nycd.exe src/nyc-cli.exe src/nyc-tx.exe src/nyc-wallet.exe release-windows/ 2>/dev/null || true

      - name: Upload Windows installer + CLI
        uses: actions/upload-artifact@v4
        with:
          name: NewYorkCoin-Core-Windows
          path: release-windows/
          retention-days: 30
